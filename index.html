<script>try{var t=localStorage.getItem('ssv-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* ① 테마와 무관한 토큰 */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --r-1:6px;--r-2:10px;--r-3:14px;--r-full:999px;          /* 작은 컨트롤 6 · 버튼·입력 10 · 패널·장면 14 · 상태 알약 full */
  --control-h:36px;--icon-size:18px;--h-top:56px;--panel-w:clamp(318px,26vw,352px);
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  /* 밤하늘 장면 — 두 테마 모두 어두운 채로 남는다(§11-8). 장면 위 글자·선은 이 토큰만 쓴다 */
  --night-0:#050912;--night-1:#0a1122;--night-2:#101a31;
  --on-stage-1:#e8edf7;--on-stage-2:#aeb9cd;--on-stage-3:#8a97ae;--stage-line:#8ea3cf;--stage-grid:#24304a;--stage-chip-bg:#0d1528e6;--on-stage-accent:#8fe0d0;
  --ok-mark:#7ee0a0;--bad-mark:#ff9d8a;
}
/* ② 테마 토큰 — 두 블록은 같은 목록, 값만 다르다 */
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0a0f19;--surface-1:#101725;--surface-2:#182133;
  --text-1:#e7ecf4;--text-2:#afbacb;--text-3:#8f9bb0;--line-1:#1f2a3c;--line-2:#34435b;
  --accent:#6fd3c1;--accent-strong:#9be7d9;--accent-soft:#143534;--on-accent:#06151a;--focus:#9be7d9;--scrim:#01040ab3;
  --danger:#ff9d8a;--ok:#7ed7a0;--ok-soft:#173a2c;--warn-soft:#3f3822;--bad-soft:#3b2322;
  --shadow-color:222 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#edf0f5;--surface-1:#fbfcfd;--surface-2:#e2e7ef;
  --text-1:#15223a;--text-2:#46546c;--text-3:#5a687f;--line-1:#d3dae5;--line-2:#b2bfd0;
  --accent:#0f6b60;--accent-strong:#0a5148;--accent-soft:#d5eeea;--on-accent:#ffffff;--focus:#0a5148;--scrim:#0b1a2680;
  --danger:#b3261e;--ok:#1d7a47;--ok-soft:#d8f0e2;--warn-soft:#fff2c8;--bad-soft:#fbe3df;
  --shadow-color:220 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .30);
  --edge-hi:0 0 #0000;
}
/* ③ 기본 마감 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent)}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--accent) 30%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,svg,canvas{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 6px;color:var(--text-1);background:var(--surface-2)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── 상단 막대 ── */
.top{height:var(--h-top);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);border-bottom:1px solid var(--line-1);background:var(--surface-0);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:var(--sp-2);flex:none}
.brand-chip{width:27px;height:27px;border-radius:var(--r-2);background:#FFB7B2;color:#3a1714;display:grid;place-items:center}
.brand-chip svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-word{font:700 13px/1 var(--font-ui);color:var(--text-1);white-space:nowrap}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social-set{display:flex;align-items:center;gap:6px;flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:22px;height:22px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-0)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:focus-visible .yt-body{fill:#ff0033}.social:focus-visible .yt-play{fill:#fff}
.social:focus-visible .ig-line{stroke:url(#ig-grad)}.social:focus-visible .ig-dot{fill:#d62976}
.title{font:800 18px/1.2 var(--font-ui);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:2px;padding:3px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-1);flex:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),color var(--dur-fast)}
.tab::before{content:'';position:absolute;inset:-4px -1px}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--text-1);font-weight:800;box-shadow:inset 0 -2px 0 var(--accent)}
.tab .tl-short{display:none}
.tab .badge{font:700 11px/1 var(--font-ui);padding:3px 6px;border-radius:var(--r-full);background:var(--accent-soft);color:var(--accent-strong);border:0}
.spacer{flex:1}
.util{display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.94)}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px;flex:none}

/* ── 실험 화면 ── */
body{height:100dvh;display:grid;grid-template-rows:var(--h-top) 1fr;overflow:hidden}
main{min-height:0;position:relative;overflow:hidden}
.lab{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);gap:var(--sp-3);padding:var(--sp-3)}
.bench{display:flex;flex-direction:column;min-height:0;min-width:0}
.bench-head{height:44px;display:flex;align-items:center;gap:var(--sp-3);padding:0 2px 6px}
.bh-title{display:flex;align-items:baseline;gap:var(--sp-3);min-width:0;flex:1}
.bh-title h2{font:800 18px/1.3 var(--font-ui);letter-spacing:-.02em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bh-title h2 .t-short{display:none}
.state-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-full);border:1px solid var(--line-2);font:600 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap;min-width:0}
.state-chip .dot{width:10px;height:10px;border-radius:50%;background:var(--text-3);box-shadow:0 0 0 1px #0006;flex:none}
.state-chip span{overflow:hidden;text-overflow:ellipsis}
.tool{position:relative;display:inline-flex;align-items:center;gap:7px;height:var(--control-h);padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:transparent;color:var(--text-1);font:600 13px/1 var(--font-ui);white-space:nowrap;cursor:pointer;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.tool::before{content:'';position:absolute;inset:-4px -1px}
.tool:active{transform:scale(.96)}
.tool[aria-busy="true"]{opacity:.55;cursor:progress}
.stage{position:relative;flex:1;min-height:0;border-radius:var(--r-3);overflow:hidden;background:var(--night-0);border:1px solid var(--line-1);user-select:none;-webkit-user-select:none}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.obs{min-height:34px;margin:0;padding:8px 4px 0;display:flex;gap:10px;align-items:flex-start;font:500 15px/1.5 var(--font-ui);color:var(--text-1)}
.obs svg{margin-top:2px;color:var(--accent)}
.shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:shut 320ms var(--ease-out)}
@keyframes shut{0%{opacity:.55}100%{opacity:0}}

/* ── 조작판 ── */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--surface-1);border:1px solid var(--line-1);border-radius:var(--r-3);box-shadow:var(--shadow-1)}
.panel-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:var(--sp-3) var(--sp-4) var(--sp-3);
  background:linear-gradient(var(--surface-1) 30%,transparent) top/100% 24px no-repeat local,linear-gradient(transparent,var(--surface-1) 70%) bottom/100% 24px no-repeat local,
    radial-gradient(farthest-side at 50% 0,hsl(var(--shadow-color)/.35),transparent) top/100% 10px no-repeat scroll,radial-gradient(farthest-side at 50% 100%,hsl(var(--shadow-color)/.35),transparent) bottom/100% 10px no-repeat scroll}
.panel-foot{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line-1)}
.panel-foot .btn{flex:1}
.sec+.sec{margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:1px solid var(--line-1)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:var(--sp-2)}
.sec-h h3{font:600 13px/1.3 var(--font-ui);color:var(--text-2);letter-spacing:0}
.hint{margin:0 0 var(--sp-3);font:400 13px/1.55 var(--font-ui);color:var(--text-2)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-2);background:transparent;color:var(--text-1);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-2px 0}
.btn:active{transform:scale(.97)}
.btn.primary{min-height:44px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{border-color:transparent;color:var(--text-2)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:0 12px}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn.primary-lite{border-color:var(--accent);color:var(--text-1);font-weight:800}
.row{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.row>.btn{flex:1}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0)}
.seg button{position:relative;flex:1;min-height:34px;padding:0 6px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button::before{content:'';position:absolute;inset:-5px -1px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text-1);font-weight:800;box-shadow:inset 0 -2px 0 var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp-2)}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-1);font:600 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.chip::before{content:'';position:absolute;inset:-5px -2px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:800}
.chip[aria-pressed="true"]::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);order:-1}
/* 보기 스위치 */
.tog{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 8px;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-1);font:600 13px/1.35 var(--font-ui);text-align:left;cursor:pointer}
.tog .tx{flex:1;display:flex;flex-direction:column}
.tog .tx small{font:500 12px/1.4 var(--font-ui);color:var(--text-2)}
.tog .ic{color:var(--text-2)}
.tog .track{position:relative;width:34px;height:20px;border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--line-2);flex:none;transition:background var(--dur-fast),border-color var(--dur-fast)}
.tog .track::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-2);transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast)}
.tog[aria-checked="true"] .track{background:var(--accent);border-color:var(--accent)}
.tog[aria-checked="true"] .track::after{transform:translateX(14px);background:var(--on-accent)}
.tog[aria-checked="true"] .ic{color:var(--accent)}
.togs{display:grid;grid-template-columns:1fr 1fr;gap:0 4px}

/* 별 견본 · 고른 별 */
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 1px #0000004d,0 0 6px var(--c,#fff);background:radial-gradient(circle at 42% 38%,#fff 0 18%,var(--c,#fff) 46%,var(--c,#fff) 100%)}
.sw.big{width:54px;height:54px;box-shadow:0 0 0 1px #00000040,0 0 22px color-mix(in oklab,var(--c) 70%,transparent)}
.pick{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:12px;border-radius:var(--r-2);background:var(--night-1);color:var(--on-stage-1)}
.pick .sw.big{grid-row:span 2}
.pick h4{margin:0;font:800 18px/1.25 var(--font-ui)}
.pick .des{font:500 12px/1.4 var(--font-ui);color:var(--on-stage-2)}
.pick dl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0;font:500 13px/1.45 var(--font-ui)}
.pick dt{color:var(--on-stage-2)}
.pick dd{margin:0;color:var(--on-stage-1)}
.pick dd b{font:800 22px/1.1 var(--font-ui);font-variant-numeric:tabular-nums}
.pick dd small{color:var(--on-stage-2);font-size:12px}
.pick .note{grid-column:1/-1;margin:2px 0 0;font:500 12px/1.5 var(--font-ui);color:var(--on-stage-2)}
.catchip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 6px;border-radius:var(--r-full);background:#ffffff14;font:700 13px/1.4 var(--font-ui);color:var(--on-stage-1)}
.catchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.empty{margin:var(--sp-2) 0 0;font:400 13px/1.55 var(--font-ui);color:var(--text-2)}

/* 별 목록 · 기록표 */
.rec{width:100%;border-collapse:collapse;margin-top:var(--sp-2);font-size:13px}
.rec th{padding:4px 6px;border-bottom:1px solid var(--line-2);font:600 12px/1.3 var(--font-ui);color:var(--text-2);text-align:left;white-space:nowrap}
.rec td{padding:5px 6px;border-bottom:1px solid var(--line-1);font-variant-numeric:tabular-nums;vertical-align:middle}
.rec .num{text-align:right;white-space:nowrap}
.rec tr.fresh td{background:var(--accent-soft)}
.rec .x{width:30px;padding:0;text-align:right}
.starlist tbody tr{cursor:pointer}
.starlist td:first-child{width:22px;padding-right:0}
.starlist .nm{font-weight:700}
.starlist tr[aria-selected="true"] td{background:var(--surface-2)}
.starlist tr[aria-selected="true"] .nm{color:var(--text-1)}
.starlist button.rowbtn{all:unset;display:block;cursor:pointer;min-height:26px;line-height:26px;font-weight:700}
.starlist button.rowbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.xbtn{position:relative;width:28px;height:28px;display:inline-grid;place-items:center;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer}
.xbtn::before{content:'';position:absolute;inset:-8px -2px}
.xbtn svg.ic{width:15px;height:15px}
.legend{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:32px;font:600 13px/1.3 var(--font-ui)}
.legend li small{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.legend li .n{font:600 12px/1 var(--font-ui);color:var(--text-2);font-variant-numeric:tabular-nums}
.result{margin:var(--sp-3) 0 0;padding:10px 12px;border-radius:var(--r-2);background:var(--surface-2);font:600 15px/1.5 var(--font-ui)}
.result small{display:block;font:500 13px/1.5 var(--font-ui);color:var(--text-2);margin-top:2px}
.result.ok{background:var(--ok-soft)}
.setlist{display:grid;gap:4px}
.setlist button{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:6px 10px;border:1px solid var(--line-1);border-radius:var(--r-2);background:transparent;color:var(--text-1);font:600 13px/1.3 var(--font-ui);text-align:left;cursor:pointer}
.setlist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:800}
.setlist .dots{display:flex;gap:3px;flex:none}
.setlist .dots .sw{width:10px;height:10px}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.refs .chip .sw{width:12px;height:12px}

/* ── 장면 SVG (밤하늘 — 테마와 무관한 on-stage 토큰만) ── */
.scene-svg text{font-family:var(--font-ui)}
.sky-bg{fill:var(--night-0)}
.st-n0{stop-color:var(--night-2)}.st-n1{stop-color:var(--night-0)}
.con-line{stroke:var(--stage-line);stroke-width:1.3;stroke-linecap:round;opacity:.55;fill:none;transition:opacity var(--dur-ui)}
.con-line.dim{opacity:.16}
.con-name{font-size:13px;font-weight:700;fill:var(--on-stage-2);text-anchor:middle;letter-spacing:.02em;paint-order:stroke;stroke:var(--night-0);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.con-name.dim{opacity:.45}
.star{cursor:pointer;outline:none}
.star .hit{fill:transparent}
.star.dim{opacity:.38}
.star .ring{fill:none;stroke:var(--on-stage-1);stroke-width:1.5;opacity:0}
.star.sel .ring{opacity:.95}
.star:focus-visible .ring{opacity:1;stroke:var(--on-stage-accent);stroke-dasharray:3 2.5}
.star-core-hi{fill:#fff}
.star-name{font-size:13px;font-weight:700;fill:var(--on-stage-1);paint-order:stroke;stroke:var(--night-0);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.star-name.dim{fill:var(--on-stage-2);font-weight:600}
.star-temp{font-size:12px;font-weight:600;fill:var(--on-stage-2);paint-order:stroke;stroke:var(--night-0);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-variant-numeric:tabular-nums}
.hud-t{font-size:15px;font-weight:800;fill:var(--on-stage-1)}
.hud-s{font-size:12px;font-weight:500;fill:var(--on-stage-2)}
.compass-t{font-size:12px;font-weight:700;fill:var(--on-stage-2)}
.compass-l{stroke:var(--on-stage-3);stroke-width:1.2;fill:none;stroke-linecap:round}
.beam-glow{fill:none;stroke-width:6;opacity:.18;stroke-linecap:round}
.beam{fill:none;stroke-width:1.7;stroke-linecap:round}
.rb-band{stroke:#ffffff26;stroke-width:1}
.rb-div{stroke:var(--night-0);stroke-width:1.4;opacity:.75}
.rb-cat{font-size:12px;font-weight:700;fill:var(--on-stage-2);text-anchor:middle}
.rb-cat.on{fill:var(--on-stage-1);font-weight:800}
.rb-end{font-size:11px;font-weight:600;fill:var(--on-stage-3)}
.rb-tick{stroke:var(--on-stage-3);stroke-width:1}
.rb-tick-t{font-size:11px;font-weight:600;fill:var(--on-stage-2);text-anchor:middle;font-variant-numeric:tabular-nums}
.rb-mark{stroke:var(--night-0);stroke-width:1.2}
.rb-bubble{fill:var(--stage-chip-bg);stroke:#ffffff33;stroke-width:1}
.rb-bubble-t{font-size:13px;font-weight:800;fill:var(--on-stage-1);font-variant-numeric:tabular-nums}
.rb-bubble-s{font-size:12px;font-weight:600;fill:var(--on-stage-2)}
.rb-knob{fill:var(--on-stage-1);stroke:var(--night-0);stroke-width:2}
.rb-needle{stroke:var(--on-stage-1);stroke-width:2}
.slider-g{cursor:ew-resize;outline:none}
.slider-g:focus-visible .rb-knob{stroke:var(--on-stage-accent);stroke-width:3}
/* 순서 맞히기 */
.ord{cursor:grab;outline:none}
.ord.lift{cursor:grabbing}
.ord .ord-ring{fill:none;stroke:var(--on-stage-accent);stroke-width:2;stroke-dasharray:4 3;opacity:0}
.ord:focus-visible .ord-ring,.ord.picked .ord-ring{opacity:1}
.ord-name{font-size:14px;font-weight:800;fill:var(--on-stage-1);text-anchor:middle}
.ord-cat{font-size:12px;font-weight:700;fill:var(--on-stage-2);text-anchor:middle}
.ord-temp{font-size:13px;font-weight:800;fill:var(--on-stage-1);text-anchor:middle;font-variant-numeric:tabular-nums}
.ord-slot{fill:none;stroke:var(--stage-grid);stroke-width:1.2;stroke-dasharray:3 4}
.ord-no{font-size:12px;font-weight:700;fill:var(--on-stage-3);text-anchor:middle}
.ord-mark-ok{fill:var(--ok-mark)}.ord-mark-bad{fill:var(--bad-mark)}
.ord-mark-t{font-size:12px;font-weight:800;fill:var(--night-0);text-anchor:middle}
.ord-arrow{stroke:var(--on-stage-3);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ord-dir{font-size:13px;font-weight:700;fill:var(--on-stage-2)}
/* 모든 별 한눈에 */
.ch-row{fill:#ffffff06}
.ch-row.alt{fill:#ffffff0c}
.ch-row.hl{fill:#8fe0d01f}
.ch-lab{font-size:13px;font-weight:700;fill:var(--on-stage-2);text-anchor:end;dominant-baseline:central}
.ch-lab.hl{fill:var(--on-stage-1);font-weight:800}
.ch-col{opacity:.13}
.ch-div{stroke:#ffffff30;stroke-width:1}
.ch-cat{font-size:12px;font-weight:800;text-anchor:middle}
.ch-dot{stroke:var(--night-0);stroke-width:1;cursor:pointer}
.ch-dot.dim{opacity:.4}
.ch-sel{fill:none;stroke:var(--on-stage-1);stroke-width:1.6}
.ch-tip{fill:var(--stage-chip-bg);stroke:#ffffff33}
/* 온도와 빛의 색 */
.gl-label{font-size:16px;font-weight:700;fill:var(--on-stage-2)}
.gl-big{font-size:44px;font-weight:800;fill:var(--on-stage-1);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gl-unit{font-size:22px;font-weight:700;fill:var(--on-stage-2)}
.gl-sub{font-size:16px;font-weight:600;fill:var(--on-stage-2)}
.gl-cat{font-size:18px;font-weight:800;fill:var(--on-stage-1)}
.sp-axis{stroke:var(--on-stage-3);stroke-width:1.2;fill:none}
.sp-grid{stroke:var(--stage-grid);stroke-width:1}
.sp-t{font-size:14px;font-weight:600;fill:var(--on-stage-2)}
.sp-tt{font-size:16px;font-weight:800;fill:var(--on-stage-1)}
.sp-curve{fill:none;stroke:var(--on-stage-1);stroke-width:2.4;stroke-linejoin:round}
.sp-dim{fill:#ffffff10}
.sp-band-t{font-size:13px;font-weight:700;fill:var(--on-stage-2);text-anchor:middle}
.sp-pct{font-size:16px;font-weight:800;fill:#0a0f19;text-anchor:middle;font-variant-numeric:tabular-nums}
.sp-pct.lt{fill:var(--on-stage-1)}
.ref-t{font-size:13px;font-weight:700;fill:var(--on-stage-2);text-anchor:middle}
.ref-l{stroke:var(--on-stage-3);stroke-width:1}
.ref-g{cursor:pointer}
/* 간이 실험 그림 */
.mini-t{font-size:13px;font-weight:700;fill:var(--on-stage-1)}
.mini-s{font-size:12px;font-weight:600;fill:var(--on-stage-2)}
.metal{fill:#8e97a3}.metal-lo{fill:#4f5864}.metal-hi{fill:#d3d9e0}
.heater-body{fill:#2a303a;stroke:#4a5260;stroke-width:1.5}
.heater-refl{fill:#56606e}

/* ── 서랍 · 모달 · 토스트 ── */
.drawer{position:fixed;inset:0 0 0 auto;margin:0;height:100dvh;max-height:100dvh;width:clamp(360px,34vw,480px);max-width:100vw;padding:0;border:0;border-left:1px solid var(--line-1);background:var(--surface-1);color:var(--text-1);box-shadow:var(--edge-hi),var(--shadow-3);flex-direction:column}
.drawer[open]{display:flex}
.drawer::backdrop,.modal::backdrop{background:var(--scrim)}
:is(dialog).sheet{opacity:0;transform:translateX(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
:is(dialog[open]).sheet{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{:is(dialog[open]).sheet{opacity:0;transform:translateX(var(--lift))}}
.modal.sheet{transform:translateY(var(--lift))}
.modal.sheet[open]{transform:none}
@starting-style{.modal.sheet[open]{opacity:0;transform:translateY(var(--lift))}}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4) var(--sp-4) var(--sp-3) var(--sp-5);border-bottom:1px solid var(--line-1)}
.d-head h2{font:800 18px/1.3 var(--font-ui)}
.d-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:var(--sp-4) var(--sp-5) var(--sp-8)}
.d-foot{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line-1)}
.card+.card{margin-top:var(--sp-8);padding-top:var(--sp-6);border-top:1px solid var(--line-1)}
.card .k{font:700 12px/1 var(--font-ui);color:var(--accent);margin-bottom:6px}
.card h3{font:800 18px/1.35 var(--font-ui);margin-bottom:var(--sp-3)}
.card .fig{position:relative;aspect-ratio:16/9;border-radius:var(--r-2);overflow:hidden;background:var(--night-0);border:1px solid var(--line-1);margin-bottom:var(--sp-3)}
.card .fig>svg{position:absolute;inset:0;width:100%;height:100%}
.card p{margin:0 0 var(--sp-2);font:400 15px/1.7 var(--font-ui);max-width:44ch}
.card .def{font-weight:600}
.card ul{margin:0 0 var(--sp-2);padding-left:1.1em;font-size:15px;line-height:1.65;max-width:44ch}
.card .link{color:var(--text-2);font-size:13px}
.card details.more{margin:var(--sp-2) 0;font-size:13px}
.card details.more summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:700;color:var(--text-2)}
.card details.more p{font-size:13px}
.modal{width:min(640px,calc(100vw - 32px));max-height:min(86dvh,760px);padding:0;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1);color:var(--text-1);box-shadow:var(--edge-hi),var(--shadow-3);flex-direction:column}
.modal.narrow{width:min(460px,calc(100vw - 32px))}
.modal[open]{display:flex}
.dialog-actions{display:flex;justify-content:flex-end;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)}
.dialog-actions.start{justify-content:flex-start}
.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
label.txt{display:grid;gap:6px;font:600 13px/1.3 var(--font-ui);color:var(--text-2)}
label.txt input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0)}
.check{display:flex;gap:9px;align-items:center;min-height:40px;font:500 13px/1.4 var(--font-ui);cursor:pointer}
.check input{width:18px;height:18px;flex:none}
fieldset.opts{margin:var(--sp-3) 0 0;padding:8px 12px 4px;border:1px solid var(--line-1);border-radius:var(--r-2)}
fieldset.opts legend{padding:0 6px;font:800 13px/1 var(--font-ui)}
.wipe-list{margin:0 0 10px;padding-left:20px;line-height:1.7}
.help-doc h3{font:800 15px/1.35 var(--font-ui);margin:var(--sp-5) 0 6px}
.help-doc h3:first-child{margin-top:0}
.help-doc ol,.help-doc ul{margin:0;padding-left:20px;font-size:15px;line-height:1.7}
.help-doc p{margin:0 0 6px;font-size:15px;line-height:1.7}
.help-doc .keys{line-height:2.2}
.help-p{margin:var(--sp-2) 0 0;font:400 13px/1.6 var(--font-ui);color:var(--text-2)}
.warn{color:var(--danger);font:600 13px/1.5 var(--font-ui);min-height:20px;margin:6px 0 0}
.brandblock{margin-top:var(--sp-5);padding:var(--sp-4);border-radius:var(--r-2);background:var(--surface-2);font:500 13px/1.8 var(--font-ui)}
.brandblock a{color:var(--text-1)}
.ver-line{color:var(--text-2);font-size:13px!important;margin-top:var(--sp-3)!important}
.linkbtn{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 6px;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);font:600 12px/1 var(--font-ui);cursor:pointer}
.linkbtn::before{content:'';position:absolute;inset:-7px -2px}
.linkbtn svg.ic{width:15px;height:15px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;max-width:min(380px,calc(100vw - 32px));padding:10px 14px;border-radius:var(--r-2);background:var(--text-1);color:var(--surface-0);font:600 13px/1.5 var(--font-ui);box-shadow:var(--shadow-3)}
.toast.error{background:var(--bad-soft);color:var(--text-1);border:1px solid var(--danger)}
.toast-act{flex:none;min-height:32px;padding:0 10px;border:1px solid currentColor;border-radius:var(--r-1);background:transparent;color:inherit;font:700 13px/1 var(--font-ui);cursor:pointer}
.toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:inherit;cursor:pointer}

/* ── 탐구 질문 (§9) ── */
.quiz{height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;position:relative}
.quiz-in{max-width:1240px;margin:0 auto;padding:var(--sp-5) var(--sp-5) var(--sp-12)}
.quiz-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-4);flex-wrap:wrap}
.quiz-head h2{font:800 clamp(22px,2.2vw,26px)/1.2 var(--font-ui);letter-spacing:-.03em}
.quiz-head p{margin:6px 0 0;color:var(--text-2);font-size:15px}
.prog{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--font-ui);color:var(--text-2)}
.prog .dots{display:flex;gap:4px}
.prog .dots i{width:18px;height:6px;border-radius:var(--r-full);background:var(--line-2)}
.prog .dots i.done{background:var(--accent)}
.policy{margin:0 0 var(--sp-4);padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-1);font:500 13px/1.6 var(--font-ui)}
.policy p{margin:0}.policy .save-note{color:var(--text-2);margin-top:2px}
.qlist{display:grid;gap:var(--sp-3)}
.qcard{border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface-1)}
.qcard summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;cursor:pointer;border-radius:var(--r-3)}
.qcard summary::-webkit-details-marker{display:none}
.qcard .qn{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);font:800 13px/1 var(--font-ui)}
.qcard .qt{font:700 15px/1.4 var(--font-ui);min-width:0}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.badge{padding:3px 8px;border-radius:var(--r-full);border:1px solid var(--line-2);font:600 12px/1.2 var(--font-ui);color:var(--text-2);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:currentColor}
.badge.lock{background:var(--ok-soft);color:var(--text-1);border-color:transparent}
.badge.rev{background:var(--accent-soft);color:var(--text-1);border-color:transparent}
.badge.hint{background:var(--warn-soft);color:var(--text-1);border-color:transparent}
.chev{color:var(--text-2);transition:transform var(--dur-fast) var(--ease-out)}
.qcard[open] .chev{transform:rotate(90deg)}
.qbody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--sp-6);padding:0 16px 18px;align-items:start}
figure.mini{margin:0;position:sticky;top:8px;border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--night-0);overflow:hidden}
.mini figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;padding:8px 12px;border-bottom:1px solid var(--line-1);background:var(--surface-1);font:500 13px/1.5 var(--font-ui)}
.mini figcaption .tag{padding:2px 7px;border-radius:var(--r-1);background:var(--accent-soft);color:var(--text-1);font:700 12px/1.3 var(--font-ui)}
.mini figcaption b{font-weight:800}
.mini figcaption .how{color:var(--text-2);flex-basis:100%}
.mini-stage{position:relative;width:100%;aspect-ratio:16/10;max-height:300px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mini-stage>svg{position:absolute;inset:0;width:100%;height:100%}
.mini-result{margin:0;padding:8px 12px;min-height:46px;border-top:1px solid var(--line-1);background:var(--surface-1);font:500 13px/1.5 var(--font-ui);font-variant-numeric:tabular-nums}
.mini-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line-1);background:var(--surface-1)}
.mini-ctl:empty{display:none}
.mini-ctl .rng{display:flex;align-items:center;gap:8px;flex:1;min-width:190px;font:600 13px/1 var(--font-ui)}
.mini-ctl .rng input{flex:1;min-width:90px;margin:0}
.mini-ctl .rng output{min-width:56px;font:800 15px/1 var(--font-ui);font-variant-numeric:tabular-nums;text-align:right}
.qq{margin:0 0 6px;font:700 18px/1.5 var(--font-ui)}
.qsrc{margin:0 0 var(--sp-4);font:400 13px/1.5 var(--font-ui);color:var(--text-2)}
.alabel{display:block;margin-bottom:6px;font:600 13px/1.3 var(--font-ui);color:var(--text-2)}
.qtext textarea{width:100%;min-height:124px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-0);color:var(--text-1);font:400 16px/1.6 var(--font-ui);resize:vertical}
.qtext textarea.locked{background:var(--surface-2);color:var(--text-2)}
.arow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px;font:500 12px/1.4 var(--font-ui);color:var(--text-2)}
.lockline{color:var(--text-1);font-weight:600}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.hintp,.modelp,.revp{margin-top:8px;padding:10px 12px;border-radius:var(--r-2);font:400 15px/1.65 var(--font-ui)}
.hintp{background:var(--warn-soft)}
.hintp p,.modelp p{margin:0}
.hintp small{display:block;margin-top:4px;color:var(--text-2);font-size:12px}
.modelp{background:var(--ok-soft)}
.modelp h4,.revp h4{margin:0 0 4px;font:800 13px/1.3 var(--font-ui)}
.modelp mark{background:none;color:inherit;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--ok)}
.revp{background:var(--accent-soft)}
.revp .revnote{margin:0 0 6px;font-size:13px;color:var(--text-2)}
.revp .cnt{display:block;margin-top:4px;font-size:12px;color:var(--text-2)}
.quiz-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:var(--sp-5) 2px var(--sp-3)}
.textlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--text-2);font:600 13px/1 var(--font-ui);text-decoration:none}
.textlink svg{width:20px;height:20px}
.textlink .yt-body{fill:currentColor}.textlink .yt-play{fill:var(--surface-0)}
.textlink:is(:hover,:focus-visible){color:var(--text-1)}
.textlink:is(:hover,:focus-visible) .yt-body{fill:#ff0033}.textlink:is(:hover,:focus-visible) .yt-play{fill:#fff}

/* ── 넓은 화면 hover ── */
@media (hover:hover) and (pointer:fine){
  .icon-btn:hover,.tab:not([aria-selected="true"]):hover,.tool:hover,.btn:not(.primary):not(:disabled):hover,.tog:hover,.social:hover,.linkbtn:hover,.xbtn:hover,.chip:hover,.setlist button:hover{background:var(--surface-2);color:var(--text-1)}
  .btn.primary:hover{filter:brightness(1.07)}
  .qcard summary:hover{background:var(--surface-2)}
  .starlist tbody tr:hover td{background:var(--surface-2)}
  #yt:hover .yt-body{fill:#ff0033}#yt:hover .yt-play{fill:#fff}#ig:hover .ig-line{stroke:url(#ig-grad)}#ig:hover .ig-dot{fill:#d62976}
}

/* ── 중간 폭 ── */
@media (max-width:1240px){ .title,.title+.vdiv{display:none} }
@media (max-width:1040px){ .qbody{grid-template-columns:1fr} figure.mini{position:static} .tab{padding:0 10px 0 9px} .tab .tl-long{display:none} .tab .tl-short{display:inline} }

/* ── 휴대폰·좁은 화면: 장면 → 조작판 순서로 흐르고, 탭은 아래 내비로 ── */
@media (max-width:760px){
  :root{--h-top:52px}
  body{height:auto;min-height:100dvh;display:block;overflow:auto;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .top{gap:var(--sp-2);padding:0 var(--sp-3)}
  .top .hide-narrow{display:none}
  .util .help-btn,.util .report-btn,.util .hsep{display:none}
  main{overflow:visible}
  .lab{display:block;height:auto;padding:0 var(--sp-3) var(--sp-4)}
  .bench{position:sticky;top:0;z-index:10;background:var(--surface-0);padding-top:var(--sp-2)}
  .bench-head{height:40px}
  .bh-title h2{font-size:15px}
  .stage{flex:none;aspect-ratio:var(--stage-ar,.95);max-height:58svh}
  .obs{min-height:30px;font-size:13px;padding-top:6px}
  .panel{margin-top:var(--sp-3)}
  .panel-scroll{overflow:visible;background:none}
  .panel-foot{background:var(--surface-1);border-radius:0 0 var(--r-3) var(--r-3)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;border:0;border-top:1px solid var(--line-1);background:var(--surface-1);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .tab{flex:1;flex-direction:column;justify-content:center;height:52px;gap:3px;padding:0 4px;font-size:12px}
  .tab .tl-long{display:none}
  .tab .tl-short{display:inline}
  .tab[aria-selected="true"]{box-shadow:inset 0 2px 0 var(--accent)}
  .tab .badge{display:none}
  .quiz{height:auto;overflow:visible}
  .quiz-in{padding:var(--sp-4) 0 var(--sp-8)}
  .quiz-head,.policy{margin-left:var(--sp-3);margin-right:var(--sp-3)}
  .qcard{border-radius:0;border-left:0;border-right:0}
  .qcard summary{flex-wrap:wrap;padding:10px 12px}
  .badges{flex-basis:100%;justify-content:flex-start;order:3;margin-left:40px}
  .qbody{padding:0 0 16px}
  .qtext{padding:0 12px}
  figure.mini{border-radius:0;border-left:0;border-right:0}
  .drawer{inset:auto 0 0 0;width:100vw;height:86dvh;border-left:0;border-top:1px solid var(--line-1);border-radius:var(--r-3) var(--r-3) 0 0}
  :is(dialog).drawer.sheet{transform:translateY(var(--lift))}
  :is(dialog[open]).drawer.sheet{transform:none}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .bh-cap span{display:none}
  .bh-cap{width:44px;padding:0;justify-content:center}
  .two-cols{grid-template-columns:1fr}
}
@media (max-width:760px) and (max-height:640px){ .bench{position:static} }
@media (max-width:480px){ .bh-title h2 .t-long{display:none} .bh-title h2 .t-short{display:inline} }
@media (max-width:360px){ .state-chip{display:none} }
@media (max-width:380px){ .brand-word{font-size:12px} .social{width:32px} .social-set{gap:2px} .top{gap:6px} .icon-btn{width:34px} }

/* ── 인쇄 (학습 리포트 · 빈 학습지) ── */
.printview{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm 13mm}
  :root{color-scheme:light}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;display:block!important;padding:0!important}
  body>*:not(.printview){display:none!important}
  .printview{display:block!important;color:#111}
  .pv{font:400 10.5pt/1.55 var(--font-ui);color:#111}
  .pv-kick{margin:0;font-size:9pt;color:#555;font-weight:600}
  .pv h1{font:800 17pt/1.3 var(--font-ui);margin:2px 0 8px}
  .pv-id{display:flex;gap:18px;padding:6px 0;border-top:1.5px solid #111;border-bottom:1px solid #999;font-size:10.5pt}
  .pv-id.blank i{display:inline-block;width:110px;border-bottom:1px solid #111;margin-left:6px;height:14px}
  .pv-policy{margin:4px 0 0;font-size:9pt;color:#555}
  .pv-sec{margin-top:14px}
  .pv-sec h2{font:800 12pt/1.3 var(--font-ui);margin:0 0 6px}
  .pv-t{width:100%;border-collapse:collapse;font-size:9.5pt}
  .pv-t th,.pv-t td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  .pv-t td.num{text-align:right;white-space:nowrap}
  .pv-t.ws td{height:26px}
  .pv-q{break-inside:avoid;margin:12px 0 0;padding-top:8px;border-top:1px solid #bbb}
  .pv-q h3{font:800 11pt/1.3 var(--font-ui);margin:0 0 4px}
  .pv-qq{margin:0 0 6px}
  .pv-fig{max-width:110mm;margin:4px 0 6px}
  .pv-fig svg{display:block;width:100%;height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pv-tags{margin:0 0 4px;font-size:8.5pt;color:#555}
  .pv-ans.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
  .pv-ans h4{font:800 9.5pt/1.3 var(--font-ui);margin:0 0 3px}
  .pv-ans>div{border:1px solid #999;border-radius:4px;padding:6px 8px}
  .pv-ans p{margin:0}
  .pv-empty{color:#666}
  .pv mark{background:none;color:inherit;font-weight:800;text-decoration:underline}
  .lines i{display:block;height:9mm;border-bottom:1px solid #999}
  .ws-rev{font:700 9.5pt/1.3 var(--font-ui);margin:8px 0 0;color:#333}
  .pv-key{break-before:page}
  .pv-key p{margin:0 0 6px}
  .pv-foot{margin-top:18px;padding-top:6px;border-top:1px solid #999;font-size:8pt;color:#555}
  .pv-sub{font:700 10.5pt/1.3 var(--font-ui);margin:10px 0 4px}
  .pv-sw{display:inline-block;width:9pt;height:9pt;border-radius:50%;border:.5pt solid #555;vertical-align:-1pt;margin-right:4pt}
}

/* ⑤ 사용자 설정 */
@media (prefers-reduced-motion:reduce){:root{--lift:0px} .chev{transition:none}}
@media (prefers-contrast:more){:root[data-theme]{--line-1:var(--line-2);--text-3:var(--text-2)} :root{--on-stage-2:#d3dbe8;--on-stage-3:#b3bfd2}}
@media (prefers-reduced-transparency:reduce){.toast{box-shadow:none}}

   표면 온도는 영어 위키백과 각 별 문서의 유효 온도(2026-09 확인, 문서가 인용한 논문 값)를 썼다.
   T가 [낮은 값, 높은 값]이면 두 별이 함께 보이거나(카펠라) 빠르게 자전해 극과 적도의 온도가 다른 별(베가·알타이르)이다.

const APP_DATE = '2026-09-26';

const Kof = s => Array.isArray(s.T) ? (s.T[0] + s.T[1]) / 2 : s.T;           // 대표 온도(K)
const round100 = c => Math.round(c / 100) * 100;
const nf = n => n.toLocaleString('ko-KR');
const cText = K => `${nf(round100(toC(K)))} ℃`;                               // ‘약’은 화면 문장에서 붙인다
const cRange = s => Array.isArray(s.T) ? `${nf(round100(toC(s.T[0])))}~${nf(round100(toC(s.T[1])))} ℃` : cText(s.T);
const kText = s => Array.isArray(s.T) ? `${nf(s.T[0])}~${nf(s.T[1])} K` : `${nf(s.T)} K`;

  { id: 'blue', ko: '청색', alt: '파란색', minC: 30000, maxC: Infinity },

class SpecFig extends PxScene {
  constructor(host) { super(host, '온도가 다른 세 물체의 색깔별 빛의 세기 곡선'); el('rect', { x: 0, y: 0, width: '100%', height: '100%', class: 'sky-bg' }, this.svg); this.g = el('g', {}, this.svg); this.fit(); }
  layout() { this.render(); }
  recolor() { this.render(); }
  render() {
    if (!this.W) return;
    const { W, H } = this, g = this.g; g.replaceChildren();
    const x0 = 28, x1 = W - 14, y0 = 20, y1 = H - 34, L0 = 250, L1 = 1100, xl = l => x0 + (x1 - x0) * (l - L0) / (L1 - L0);
    el('rect', { class: 'sp-dim', x: xl(L0), y: y0, width: xl(380) - xl(L0), height: y1 - y0 }, g);
    el('rect', { class: 'sp-dim', x: xl(750), y: y0, width: xl(L1) - xl(750), height: y1 - y0 }, g);
    const temps = [[3779, '베텔게우스'], [5772, '태양'], [12100, '리겔']];
    let mx = 0; const curves = temps.map(([K]) => { const p = []; for (let l = L0; l <= L1; l += 10) { const v = planck(l, K); p.push([l, v]); } return p; });
    curves.forEach(c => c.forEach(([, v]) => { mx = Math.max(mx, v); }));
    curves.forEach((c, i) => {
      const own = Math.max(...c.map(p => p[1]));
      let d = ''; c.forEach(([l, v], j) => { d += `${j ? 'L' : 'M'}${xl(l).toFixed(1)} ${(y1 - (y1 - y0) * v / own).toFixed(1)}`; });
      const col = colK(temps[i][0]);
      el('path', { d, fill: 'none', stroke: col, 'stroke-width': 2.4 }, g);
      let pk = c[0]; for (const p of c) if (p[1] > pk[1]) pk = p;
      const px = clamp(xl(pk[0]), x0 + 30, x1 - 60);
      el('text', { class: 'sp-t', x: px + 4, y: y0 + 12 + i * 16, fill: col, style: `fill:${col}`, 'font-size': 12 }, g).textContent = `${temps[i][1]} 약 ${cText(temps[i][0])}`;
    });
    el('path', { class: 'sp-axis', d: `M${x0} ${y0}V${y1}H${x1}` }, g);
    el('text', { class: 'sp-band-t', x: (xl(380) + xl(750)) / 2, y: y1 + 16, 'font-size': 12 }, g).textContent = '눈에 보이는 빛';
    el('text', { class: 'sp-band-t', x: (xl(L0) + xl(380)) / 2, y: y1 + 16, 'font-size': 11 }, g).textContent = '자외선';
    el('text', { class: 'sp-band-t', x: (xl(750) + xl(L1)) / 2, y: y1 + 16, 'font-size': 11 }, g).textContent = '적외선';
  }
}
class RibbonFig extends PxScene {
  constructor(host) { super(host, '표면 온도에 따른 별의 색 — 왼쪽일수록 뜨거운 별'); el('rect', { x: 0, y: 0, width: '100%', height: '100%', class: 'sky-bg' }, this.svg); this.gR = el('g', {}, this.svg); this.g = el('g', {}, this.svg); this.fit(); }

class ShareFig extends PxScene {
  constructor(host) { super(host, '별빛 속 파란 빛·초록 빛·붉은 빛의 비율'); el('rect', { x: 0, y: 0, width: '100%', height: '100%', class: 'sky-bg' }, this.svg); this.g = el('g', {}, this.svg); this.fit(); }

    const ids = ['rigel', 'sun', 'betelgeuse'], x0 = 96, x1 = W - 14, rh = (H - 24) / 3;
    ids.forEach((id, i) => {
      const s = STAR_BY[id], sh = bandShares(Kof(s)), y = 12 + rh * i + rh * 0.2, h = rh * 0.6;
      starGlyph(el('g', { transform: `translate(16 ${y + h / 2})` }, g), this.defs, colS(s), 6, 2.4);
      el('text', { class: 'sp-t', x: 30, y: y + h / 2 + 5, 'font-size': 13 }, g).textContent = s.ko;
      let bx = x0;
      for (const k of ['blue', 'green', 'red']) {
        const w = (x1 - x0) * sh[k];
        el('rect', { x: bx, y, width: Math.max(0, w - 1.5), height: h, rx: 3, fill: SHARE_COL[k] }, g);

        bx += w;
      }
    });
  }
}

function syncChip() {
  const c = $('#stateChip'); if (!c) return;
  let col = null, t = '';
  if (S.screen === 'sky') { const s = STAR_BY[SKY.sel]; if (s) { col = colS(s); t = `${s.ko} · ${catOf(s).ko} · 약 ${cText(Kof(s))}`; } else t = '별을 골라 보세요'; }
  else if (S.screen === 'compare') {
    if (CMP.mode === 'order') { const set = SETS.find(x => x.id === CMP.set); t = CMP.set === 'con' ? `고른 별자리 · ${CON_BY[CMP.con].ko}` : set.ko; }
    else { const s = STAR_BY[CMP.sel]; t = s ? `${s.ko} · ${catOf(s).ko} · 약 ${cText(Kof(s))}` : `별 ${STARS.length}개와 태양`; if (s) col = colS(s); }
  } else if (S.screen === 'light') { col = colK(LIT.K); t = `약 ${cText(LIT.K)} · ${LIT.K >= RB_T0 - 150 ? catOfK(LIT.K).ko : '달군 금속의 빛'}`; }
  const d = c.querySelector('.dot'); d.style.background = col || ''; setT(c.querySelector('span'), t);
}
function obsText() {
  if (flash.text && performance.now() < flash.until) return flash.text;
  if (S.screen === 'sky') {
    const s = STAR_BY[SKY.sel];
    if (!s) return '별을 누르면 아래 색-온도 띠에 그 별의 표면 온도 자리가 표시돼요.';
    return `${s.ko}${iga(s.ko)} 띠의 ${catOf(s).ko} 자리에 놓였어요 — 띠의 왼쪽일수록 표면 온도가 높은 별이에요.`;
  }
  if (S.screen === 'compare') {
    if (CMP.mode === 'chart') return '같은 색 이름의 별은 같은 기둥에 모여요 — 왼쪽(청색)으로 갈수록 표면 온도가 높아요.';
    if (!CMP.checked) return '표면 온도가 높을 것 같은 별부터 왼쪽에 놓은 뒤 ‘온도 확인’을 눌러요.';
    const m = evalOrder(CMP.order), ok = m.filter(Boolean).length;
    return ok === m.length ? `${m.length}개 모두 맞는 자리예요 — 색이 파란 쪽일수록 표면 온도가 높아요.` : `${m.length}개 중 ${ok}개가 맞는 자리예요 — 빛줄기가 엇갈린 별을 옮겨 보세요.`;
  }
  if (S.screen === 'light') {
    const K = LIT.K;
    if (K < 1100) return '온도가 낮아 빛이 약해요 — 띠를 왼쪽으로 끌어 온도를 높여 보세요.';
    return '띠를 끌어 온도를 바꿔 보세요 — 온도가 높을수록 ‘가장 센 빛’이 파란 쪽으로 옮겨 가요.';
  }
  return '';
}
function syncObs() { setT($('#obs'), obsText()); }

function toggleView(k) {
  if (k === 'emph') {
    VIEW.emph = !VIEW.emph; store.set('emph', VIEW.emph);
    for (const id in scenes) scenes[id].recolor && scenes[id].recolor();
    for (const id in minis) { const sc = minis[id].sc; if (sc.recolor) sc.recolor(); else if (sc.render) sc.render(); }
    theoryFigs.forEach(f => f.recolor && f.recolor());
    if (S.screen === 'sky') { syncPick(); renderList(); }
    if (S.screen === 'compare' || S.screen === 'light') renderPanel();
    syncChip();
    say(VIEW.emph ? '색 차이를 강조했어요 — 교과서 색 띠처럼 진하게 칠했어요.' : '실제 별빛에 가까운 색이에요 — 실제 별빛은 생각보다 옅은 색이에요.');
    syncPanel(); return;
  }
  if (S.screen === 'sky') {
    SKY[k] = !SKY[k]; saveSky();
    scenes.sky.setOpts({ [k]: SKY[k] });
  } else if (k === 'names') {
    CMP.names = !CMP.names; scenes.compare.setNames(CMP.names);
  }

}

function cycleSky(d) {

function openMini(qid) {
  const card = $('#card-' + qid); if (!card) return;

  setT(fig.querySelector('.mini-result'), M.result(m));
}
function miniAct(qid, a, v, src) {
  const m = minis[qid]; if (!m) return;
  const M = MINIS[qid], fig = $('#card-' + qid + ' .mini');

}
function syncCard(qid) {

}

let lastTs = 0;
function loop(ts) {
  const dt = lastTs ? Math.min(0.05, Math.max(0, (ts - lastTs) / 1000)) : 0;
  lastTs = ts;
  try {
    if (isBench()) { const sc = scenes[S.screen]; if (sc) sc.step(dt); }
    else {
      for (const [qid, m] of Object.entries(minis)) {
        const card = $('#card-' + qid);
        if (!card || !card.open || !m.sc.svg.isConnected) continue;
        m.sc.step(dt);
        if (ts - m.resT > 250) {
          m.resT = ts; const fig = card.querySelector('.mini'), M = MINIS[qid];
          if (M.sync && M.sync(m, fig) === 'controls') fig.querySelector('.mini-ctl').innerHTML = M.controls(m);
          setT(fig.querySelector('.mini-result'), M.result(m));
        }
      }
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

  $('#captureBtn').innerHTML = `${icon('camera')}<span>결과 저장</span>`;
  $$('[data-close]').forEach(b => { b.innerHTML = icon('x'); });
  $('#dHelp').insertAdjacentHTML('afterbegin', icon('help')); $('#dReport').insertAdjacentHTML('afterbegin', icon('report'));
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
  syncFull();
  renderTabs();
  bind();
  go(S.screen);
  requestAnimationFrame(loop);
}
init();

</script>
</body>
</html>
